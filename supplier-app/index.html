<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0756bd">
<title>SHOHIN — Заказы и поставщики</title>
<style>
:root{--blue:#0756bd;--blue2:#0878f9;--ink:#10264a;--muted:#71819a;--bg:#f2f6fc;--line:#e4ebf5;--green:#12a85b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Arial,sans-serif;padding-bottom:84px}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.top{background:linear-gradient(135deg,#06469d,#0878f9);color:white;padding:20px 18px 24px;border-radius:0 0 26px 26px}.topline{display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:950;letter-spacing:1px}.sub{font-size:12px;color:#d9e9ff;margin-top:3px}.hello{font-size:21px;font-weight:850;margin-top:22px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.stat{background:white;color:var(--ink);border-radius:17px;padding:14px}.stat b{display:block;font-size:23px;color:var(--blue)}.stat span{font-size:12px;color:var(--muted)}.wrap{max-width:720px;margin:auto;padding:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 14px}.title{font-size:20px;font-weight:850}.muted{color:var(--muted);font-size:13px}.btn{background:var(--blue);color:white;border-radius:13px;padding:12px 15px;font-weight:750}.btn.light{background:white;color:var(--blue);border:1px solid var(--line)}.btn.green{background:var(--green)}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;outline-color:var(--blue);margin-bottom:10px;color:var(--ink)}textarea.field{resize:vertical}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 3px 14px #163d6b08}.row{display:flex;gap:11px;align-items:center}.between{justify-content:space-between}.name{font-weight:850;font-size:16px}.avatar{width:54px;height:54px;border-radius:15px;background:#e8f1ff;display:grid;place-items:center;color:var(--blue);font-size:23px;font-weight:900;flex-shrink:0}.pill{font-size:11px;color:var(--blue);background:#eaf3ff;border-radius:30px;padding:6px 9px}.tabs{display:flex;gap:8px;margin:17px 0}.tab{flex:1;background:white;border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-weight:750;color:var(--muted)}.tab.active{background:var(--blue);color:white}.hidden{display:none!important}.product{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.photo{width:66px;height:66px;object-fit:cover;border-radius:13px;background:#edf3fb;flex-shrink:0}.product-info{flex:1;min-width:0}.product-desc{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.price{font-weight:850;color:var(--blue);margin-top:4px}.qty{display:flex;align-items:center;gap:7px}.qty button{background:#eaf2ff;color:var(--blue);border-radius:9px;width:30px;height:30px;font-weight:900}.small-actions{display:flex;gap:6px;margin-top:7px}.small-actions button{font-size:11px;padding:6px 9px;border-radius:8px;background:#eef4fc;color:var(--blue)}.total{font-size:20px;font-weight:950;color:var(--blue)}.wa{background:#13aa5c;color:white;width:100%;padding:15px;border-radius:14px;font-weight:850;margin-top:12px}.empty{text-align:center;padding:30px 14px;color:var(--muted)}.modal{position:fixed;inset:0;background:#071b3488;display:flex;align-items:flex-end;justify-content:center;padding:10px;z-index:5}.sheet{background:white;border-radius:23px 23px 16px 16px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}.sheet h3{margin:0 0 15px}.actions{display:flex;gap:8px;margin-top:8px}.actions>*{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:3}.bottom button{background:transparent;color:var(--muted);font-size:11px;font-weight:700;display:grid;gap:3px;justify-items:center}.bottom button b{font-size:19px}.bottom button.active{color:var(--blue)}.back{margin-bottom:14px}.filelabel{display:block;background:#edf4ff;color:var(--blue);padding:12px;border-radius:12px;text-align:center;font-weight:750;margin-bottom:10px}footer{text-align:center;color:#9aa7b8;font-size:11px;padding:18px}
</style>
</head>
<body>
<header class="top"><div class="topline"><div><div class="brand">SHOHIN</div><div class="sub">Поставщики · товары · заказы</div></div><div style="font-size:25px">🛍️</div></div><div class="hello">Ваш бизнес под контролем</div><div class="stats"><div class="stat"><b id="statSup">0</b><span>Поставщиков</span></div><div class="stat"><b id="statOrders">0</b><span>Заказов оформлено</span></div></div></header>
<main class="wrap">
<section id="home">
 <div class="sectionhead"><div><div class="title">Мои поставщики</div><div class="muted" id="supplierCount">Добавьте первого поставщика</div></div><button class="btn" onclick="openSupplier()">＋ Добавить</button></div>
 <input class="field" id="search" placeholder="Поиск по имени или телефону..." oninput="renderSuppliers()">
 <div id="supplierList"></div>
</section>
<section id="detail" class="hidden">
 <button class="btn light back" onclick="goHome()">← Все поставщики</button>
 <div class="card"><div class="row"><div class="avatar" id="detailAvatar">П</div><div style="flex:1"><div class="title" id="detailName"></div><div class="muted" id="detailPhone"></div></div><span class="pill">Поставщик</span></div></div>
 <div class="sectionhead"><div class="title">Каталог товаров</div><button class="btn" onclick="openProduct()">＋ Товар</button></div>
 <div class="card" id="productList"></div>
 <div class="card"><div class="sectionhead"><div class="title">Корзина</div><span class="pill" id="cartCount">0 товаров</span></div><div id="cartList"></div><div class="row between" style="padding-top:12px;border-top:1px solid var(--line)"><b>Итого</b><span class="total" id="cartTotal">0 сомони</span></div><button class="wa" onclick="sendWhatsApp()">● Отправить заказ в WhatsApp</button></div>
</section>
<section id="orders" class="hidden"><div class="title" style="margin:8px 0 14px">История заказов</div><div id="ordersList"></div></section>
</main>
<nav class="bottom"><button id="navHome" class="active" onclick="navigate('home')"><b>⌂</b>Главная</button><button id="navSup" onclick="navigate('home')"><b>♙</b>Поставщики</button><button id="navOrders" onclick="navigate('orders')"><b>◷</b>История</button></nav>
<footer>SHOHIN · Ваш помощник в бизнесе</footer>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3 id="modalTitle"></h3><div id="modalFields"></div><div class="actions"><button class="btn light" onclick="closeModal()">Отмена</button><button class="btn" id="modalSave">Сохранить</button></div></div></div>
<script>
const KEY='shohin_supplier_mvp_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'{"suppliers":[],"orders":[]}')}catch(e){data={suppliers:[],orders:[]}}let activeId=null,cart={},page='home';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Память телефона заполнена. Удалите большие фото или добавьте фото меньшего размера.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' сомони';
function navigate(p){page=p;document.getElementById('home').classList.toggle('hidden',p!=='home'||!!activeId);document.getElementById('detail').classList.add('hidden');document.getElementById('orders').classList.toggle('hidden',p!=='orders');['navHome','navSup','navOrders'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(p==='orders'?'navOrders':'navHome').classList.add('active');if(p==='orders')renderOrders();renderStats()}
function renderStats(){document.getElementById('statSup').textContent=data.suppliers.length;document.getElementById('statOrders').textContent=data.orders.length}
function renderSuppliers(){let q=document.getElementById('search').value.toLowerCase();let arr=data.suppliers.filter(s=>(s.name+' '+s.phone).toLowerCase().includes(q));document.getElementById('supplierCount').textContent=data.suppliers.length+' поставщиков';document.getElementById('supplierList').innerHTML=arr.length?arr.map(s=>'<div class="card row"><div class="avatar">'+esc(s.name.slice(0,1).toUpperCase())+'</div><div style="flex:1;min-width:0" onclick="openDetail(\''+s.id+'\')"><div class="name">'+esc(s.name)+'</div><div class="muted">'+esc(s.phone)+'</div><div class="muted">'+s.products.length+' товаров</div></div><button class="btn light" onclick="openDetail(\''+s.id+'\')">Открыть →</button></div>').join(''):'<div class="empty">Поставщиков пока нет.<br>Нажмите «Добавить», чтобы создать карточку.</div>';renderStats()}
function openSupplier(){form('Новый поставщик','<input class="field" id="f_name" placeholder="Имя поставщика"><input class="field" id="f_phone" type="tel" placeholder="Номер телефона с кодом страны">',()=>{let name=document.getElementById('f_name').value.trim(),phone=document.getElementById('f_phone').value.trim();if(!name||!phone)return alert('Заполните имя и телефон');data.suppliers.push({id:uid(),name,phone,products:[]});save();closeModal();renderSuppliers()})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function form(title,html,callback){document.getElementById('modalTitle').textContent=title;document.getElementById('modalFields').innerHTML=html;document.getElementById('modalSave').onclick=callback;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openDetail(id){activeId=id;cart={};page='detail';document.getElementById('home').classList.add('hidden');document.getElementById('orders').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');document.getElementById('navHome').classList.add('active');document.getElementById('navOrders').classList.remove('active');renderDetail()}
function goHome(){activeId=null;cart={};navigate('home');renderSuppliers()}
function openProduct(){productForm(null)}
function productForm(product){let html='<label class="filelabel" for="f_photo">＋ Выбрать фото из телефона</label><input id="f_photo" type="file" accept="image/*" class="field" style="padding:9px"><div class="muted" style="margin:-5px 0 10px">Можно оставить пустым, если фото нет</div><input class="field" id="f_name" placeholder="Название товара" value="'+esc(product?.name||'')+'"><input class="field" id="f_price" type="number" min="0" step="0.01" placeholder="Цена (сомони)" value="'+(product?.price??'')+'"><textarea class="field" id="f_description" rows="3" placeholder="Описание товара">'+esc(product?.description||'')+'</textarea>';form(product?'Изменить товар':'Новый товар',html,async()=>{let name=document.getElementById('f_name').value.trim(),price=document.getElementById('f_price').value,file=document.getElementById('f_photo').files[0];if(!name||price===''||Number(price)<0)return alert('Укажите название и корректную цену');let photo=product?.photo||'';if(file){if(file.size>1500000)return alert('Выберите фото до 1,5 МБ');photo=await readPhoto(file)}let vals={name,price:Number(price),photo,description:document.getElementById('f_description').value.trim()};let s=data.suppliers.find(x=>x.id===activeId);if(product)Object.assign(product,vals);else s.products.push({id:uid(),...vals});save();closeModal();renderDetail()})}
function readPhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function editProduct(id){let s=data.suppliers.find(x=>x.id===activeId),p=s.products.find(x=>x.id===id);if(p)productForm(p)}
function deleteProduct(id){let s=data.suppliers.find(x=>x.id===activeId),p=s.products.find(x=>x.id===id);if(!p||!confirm('Удалить товар «'+p.name+'» из каталога?'))return;s.products=s.products.filter(x=>x.id!==id);delete cart[id];save();renderDetail()}
function changeQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);renderDetail()}
function renderDetail(){let s=data.suppliers.find(x=>x.id===activeId);if(!s)return goHome();document.getElementById('detailName').textContent=s.name;document.getElementById('detailPhone').textContent=s.phone;document.getElementById('detailAvatar').textContent=s.name.slice(0,1).toUpperCase();document.getElementById('productList').innerHTML=s.products.length?s.products.map(p=>'<div class="product">'+(p.photo?'<img class="photo" src="'+p.photo+'" alt="Фото товара">':'<div class="photo" style="display:grid;place-items:center;font-size:25px">📦</div>')+'<div class="product-info"><b>'+esc(p.name)+'</b><div class="price">'+money(p.price)+'</div>'+(p.description?'<div class="product-desc">'+esc(p.description)+'</div>':'')+'<div class="small-actions"><button onclick="editProduct(\''+p.id+'\')">Изменить</button><button onclick="deleteProduct(\''+p.id+'\')">Удалить</button></div></div><div class="qty"><button onclick="changeQty(\''+p.id+'\',-1)">−</button><b>'+(cart[p.id]||0)+'</b><button onclick="changeQty(\''+p.id+'\',1)">＋</button></div></div>').join(''):'<div class="empty">Каталог пока пуст. Добавьте первый товар.</div>';let chosen=s.products.filter(p=>cart[p.id]);document.getElementById('cartList').innerHTML=chosen.map(p=>'<div class="product">'+(p.photo?'<img class="photo" src="'+p.photo+'" alt="">':'')+'<div class="product-info"><b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' × '+cart[p.id]+'</div>'+(p.description?'<div class="product-desc">'+esc(p.description)+'</div>':'')+'<div class="qty" style="margin-top:7px"><button onclick="changeQty(\''+p.id+'\',-1)">−</button><b>'+cart[p.id]+'</b><button onclick="changeQty(\''+p.id+'\',1)">＋</button><button onclick="changeQty(\''+p.id+'\',-'+cart[p.id]+')">×</button></div></div><b>'+money(p.price*cart[p.id])+'</b></div>').join('')||'<div class="muted" style="padding:10px 0">Выберите товары в каталоге выше</div>';document.getElementById('cartTotal').textContent=money(chosen.reduce((a,p)=>a+p.price*cart[p.id],0));document.getElementById('cartCount').textContent=chosen.reduce((a,p)=>a+cart[p.id],0)+' товаров'}
function sendWhatsApp(){let s=data.suppliers.find(x=>x.id===activeId),items=s.products.filter(p=>cart[p.id]);if(!items.length)return alert('Сначала добавьте товары в корзину');let total=items.reduce((a,p)=>a+p.price*cart[p.id],0),msg='Здравствуйте, '+s.name+'!\nХочу оформить заказ:\n\n'+items.map(p=>'• '+p.name+' — '+cart[p.id]+' шт. × '+money(p.price)+' = '+money(p.price*cart[p.id])).join('\n')+'\n\nИтого: '+money(total);let phone=s.phone.replace(/\D/g,'');if(phone.length<7)return alert('Проверьте номер телефона поставщика');data.orders.unshift({id:uid(),supplier:s.name,phone:s.phone,items:items.map(p=>({name:p.name,qty:cart[p.id],price:p.price})),total,date:new Date().toISOString()});save();renderStats();window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank')}
function renderOrders(){document.getElementById('ordersList').innerHTML=data.orders.length?data.orders.map(o=>'<div class="card"><div class="row between"><b>'+esc(o.supplier)+'</b><span class="pill">'+new Date(o.date).toLocaleDateString('ru-RU')+'</span></div><div class="muted">'+esc(o.phone)+'</div><div style="margin:10px 0">'+o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')+'</div><b class="total">'+money(o.total)+'</b></div>').join(''):'<div class="empty">История заказов пока пуста</div>'}
renderSuppliers();renderStats();
</script>
</body></html>
