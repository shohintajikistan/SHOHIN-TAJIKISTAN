<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251d">
<title>SHOHIN — Поставщики</title>
<style>
:root{--green:#10251d;--lime:#c5f36b;--bg:#f3f6f3;--muted:#718078;--line:#e4ebe5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17251e;font:15px Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.top{background:var(--green);color:white;padding:22px 18px 26px;border-radius:0 0 25px 25px}.brand{font-size:21px;font-weight:900;letter-spacing:.5px}.sub{font-size:12px;color:#b9c9bf;margin-top:5px}.wrap{max-width:760px;margin:auto;padding:18px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.title{font-size:20px;font-weight:800;margin:7px 0 14px}.muted{color:var(--muted);font-size:13px}.btn{background:var(--green);color:white;border-radius:13px;padding:13px 16px;font-weight:700}.btn.lime{background:var(--lime);color:var(--green)}.btn.light{background:white;color:var(--green);border:1px solid var(--line)}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;outline-color:#91bf55}.stack{display:grid;gap:10px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px}.name{font-weight:800;font-size:16px}.pill{font-size:11px;color:#39724f;background:#edf7e8;border-radius:30px;padding:6px 9px}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;background:white;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700}.tab.active{background:var(--green);color:white}.product{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.qty{display:flex;align-items:center;gap:8px}.qty button{background:#edf3ed;border-radius:8px;width:30px;height:30px;font-weight:bold}.price{font-weight:800}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.sheet{background:white;border-radius:22px 22px 16px 16px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}.sheet h3{margin:0 0 14px}.sheet .field{margin-bottom:10px}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}.empty{text-align:center;padding:30px 15px;color:var(--muted)}.total{font-size:18px;font-weight:900}.wa{background:#20b95a;color:white;width:100%;padding:15px;border-radius:13px;font-weight:800;margin-top:12px}footer{text-align:center;color:#89958e;font-size:11px;padding:20px}
</style>
</head>
<body>
<header class="top"><div class="brand">SHOHIN</div><div class="sub">Управление поставщиками и заказами</div></header>
<main class="wrap">
<section id="home">
 <div class="row between"><div><div class="title">Мои поставщики</div><div class="muted" id="supplierCount">Пока нет поставщиков</div></div><button class="btn lime" onclick="openSupplier()">＋ Добавить</button></div>
 <input class="field" id="search" placeholder="Поиск поставщика..." oninput="renderSuppliers()">
 <div class="tabs"><button class="tab active" id="tabSup" onclick="showTab('sup')">Поставщики</button><button class="tab" id="tabOrders" onclick="showTab('orders')">История заказов</button></div>
 <div id="supplierList"></div><div id="ordersList" class="hidden"></div>
</section>
<section id="detail" class="hidden">
 <button class="btn light" onclick="goHome()">← Назад</button>
 <div class="row between" style="margin-top:16px"><div><div class="title" id="detailName"></div><div class="muted" id="detailPhone"></div></div><button class="btn" onclick="openProduct()">＋ Товар</button></div>
 <div class="row between"><div class="title">Товары поставщика</div><span class="pill" id="cartCount">Корзина: 0</span></div>
 <div class="card" id="productList"></div>
 <div class="card"><div class="row between"><b>Ваш заказ</b><span class="total" id="cartTotal">0 сомони</span></div><div id="cartList"></div><button class="wa" onclick="sendWhatsApp()">Отправить заказ в WhatsApp</button></div>
</section>
</main>
<footer>SHOHIN · Первая версия приложения</footer>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3 id="modalTitle"></h3><div id="modalFields"></div><div class="actions"><button class="btn light" onclick="closeModal()">Отмена</button><button class="btn" id="modalSave">Сохранить</button></div></div></div>
<script>
const KEY='shohin_supplier_mvp_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"suppliers":[],"orders":[]}');let activeId=null,cart={},tab='sup';
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' сомони';
function showTab(t){tab=t;document.getElementById('tabSup').classList.toggle('active',t==='sup');document.getElementById('tabOrders').classList.toggle('active',t==='orders');document.getElementById('supplierList').classList.toggle('hidden',t!=='sup');document.getElementById('ordersList').classList.toggle('hidden',t!=='orders');renderOrders()}
function renderSuppliers(){let q=document.getElementById('search').value.toLowerCase();let arr=data.suppliers.filter(s=>(s.name+' '+s.phone).toLowerCase().includes(q));document.getElementById('supplierCount').textContent=data.suppliers.length+' поставщиков';document.getElementById('supplierList').innerHTML=arr.length?arr.map(s=>`<div class="card row between"><div onclick="openDetail('${s.id}')" style="flex:1;cursor:pointer"><div class="name">${esc(s.name)}</div><div class="muted">${esc(s.phone)}</div><div class="muted">${s.products.length} товаров</div></div><button class="btn light" onclick="openDetail('${s.id}')">Открыть →</button></div>`).join(''):'<div class="empty">Поставщиков пока нет.<br>Нажмите «Добавить», чтобы создать первую карточку.</div>'}
function openSupplier(){modalForm('Новый поставщик',[['name','Имя поставщика','text'],['phone','Номер телефона','tel']],v=>{if(!v.name.trim()||!v.phone.trim())return alert('Заполните имя и телефон');data.suppliers.push({id:crypto.randomUUID(),name:v.name.trim(),phone:v.phone.trim(),products:[]});save();closeModal();renderSuppliers()})}
function openProduct(){modalForm('Новый товар',[['name','Название товара','text'],['price','Цена за единицу (сомони)','number']],v=>{if(!v.name.trim()||Number(v.price)<0||v.price==='')return alert('Укажите название и корректную цену');let s=data.suppliers.find(x=>x.id===activeId);s.products.push({id:crypto.randomUUID(),name:v.name.trim(),price:Number(v.price)});save();closeModal();renderDetail()})}
function modalForm(title,fields,callback){document.getElementById('modalTitle').textContent=title;document.getElementById('modalFields').innerHTML=fields.map(([id,ph,type])=>`<input class="field" id="f_${id}" type="${type}" placeholder="${ph}" ${type==='number'?'min="0" step="0.01"':''}>`).join('');document.getElementById('modalSave').onclick=()=>{let v={};fields.forEach(([id])=>v[id]=document.getElementById('f_'+id).value);callback(v)};document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openDetail(id){activeId=id;cart={};document.getElementById('home').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');renderDetail()}
function goHome(){document.getElementById('detail').classList.add('hidden');document.getElementById('home').classList.remove('hidden');activeId=null;renderSuppliers()}
function renderDetail(){let s=data.suppliers.find(x=>x.id===activeId);if(!s)return goHome();document.getElementById('detailName').textContent=s.name;document.getElementById('detailPhone').textContent=s.phone;document.getElementById('productList').innerHTML=s.products.length?s.products.map(p=>`<div class="product"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} / шт.</div></div><div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><b>${cart[p.id]||0}</b><button onclick="changeQty('${p.id}',1)">＋</button></div></div>`).join(''):'<div class="empty">Товары ещё не добавлены</div>';let chosen=s.products.filter(p=>cart[p.id]);document.getElementById('cartList').innerHTML=chosen.map(p=>`<div class="product"><span>${esc(p.name)} × ${cart[p.id]}</span><b>${money(p.price*cart[p.id])}</b></div>`).join('')||'<div class="muted" style="padding:12px 0">Выберите товары выше</div>';document.getElementById('cartTotal').textContent=money(chosen.reduce((a,p)=>a+p.price*cart[p.id],0));document.getElementById('cartCount').textContent='Корзина: '+chosen.reduce((a,p)=>a+cart[p.id],0)}
function changeQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);renderDetail()}
function sendWhatsApp(){let s=data.suppliers.find(x=>x.id===activeId),items=s.products.filter(p=>cart[p.id]);if(!items.length)return alert('Сначала добавьте товары в корзину');let total=items.reduce((a,p)=>a+p.price*cart[p.id],0);let msg='Здравствуйте, '+s.name+'!\nХочу оформить заказ:\n\n'+items.map(p=>'• '+p.name+' — '+cart[p.id]+' шт. × '+money(p.price)+' = '+money(p.price*cart[p.id])).join('\n')+'\n\nИтого: '+money(total);let phone=s.phone.replace(/\D/g,'');if(phone.length<7)return alert('Проверьте номер телефона поставщика');data.orders.unshift({id:crypto.randomUUID(),supplier:s.name,phone:s.phone,items:items.map(p=>({name:p.name,qty:cart[p.id],price:p.price})),total,date:new Date().toISOString()});save();window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');}
function renderOrders(){document.getElementById('ordersList').innerHTML=data.orders.length?data.orders.map(o=>`<div class="card"><div class="row between"><b>${esc(o.supplier)}</b><span class="pill">${new Date(o.date).toLocaleDateString('ru-RU')}</span></div><div class="muted">${esc(o.phone)}</div><div style="margin:10px 0">${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</div><b>${money(o.total)}</b></div>`).join(''):'<div class="empty">История заказов пока пуста</div>'}
renderSuppliers();
</script>
</body>
</html>
