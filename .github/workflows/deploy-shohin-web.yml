name: Deploy SHOHIN web preview

on:
  workflow_dispatch:
  push:
    paths:
      - "supplier-app/**"
      - ".github/workflows/deploy-shohin-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: supplier-app
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
