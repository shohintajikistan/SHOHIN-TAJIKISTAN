name: Build SHOHIN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "supplier-app/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install app dependencies
        working-directory: supplier-app
        run: npm install
      - name: Prepare web assets
        working-directory: supplier-app
        run: npm run build
      - name: Generate Android project
        working-directory: supplier-app
        run: npx cap add android
      - name: Sync Android project
        working-directory: supplier-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: supplier-app/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHOHIN-debug-APK
          path: supplier-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
